    DJANGO_SETTINGS_MODULE: doc_reader.settings
    DATABASE_URL: ${DATABASE_URL:-postgresql://doc_reader:doc_reader@postgres:5432/doc_reader}
    REDIS_HOST: ${REDIS_HOST:-redis}
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_DB: ${REDIS_DB:-0}
    HF_TOKEN: ${HF_TOKEN:-}
    HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-${HF_TOKEN:-}}
    DOC_READER_DOC_WORKERS: ${DOC_READER_DOC_WORKERS:-1}
    DOC_READER_MAX_WORKERS: ${DOC_READER_MAX_WORKERS:-4}
    DOC_READER_MODEL_ID: ${DOC_READER_MODEL_ID:-Qwen/Qwen2.5-7B-Instruct}
    DOC_READER_USE_4BIT: ${DOC_READER_USE_4BIT:-0}
    DOC_READER_LLM_PROVIDER: ${DOC_READER_LLM_PROVIDER:-groq}
    DOC_READER_ENABLE_LOCAL_HF_LLM: ${DOC_READER_ENABLE_LOCAL_HF_LLM:-0}
    DOC_READER_GROQ_EXTRACTION_MODEL: ${DOC_READER_GROQ_EXTRACTION_MODEL:-llama-3.3-70b-versatile}
    DOC_READER_GROQ_EXTRACTION_TIMEOUT_SECONDS: ${DOC_READER_GROQ_EXTRACTION_TIMEOUT_SECONDS:-60}
    DOC_READER_QUEUE_MODE: "rq"
    DOC_READER_USE_DOCTR_OCR: ${DOC_READER_USE_DOCTR_OCR:-0}
    DOC_READER_USE_EMBEDDED_IMAGE_OCR: ${DOC_READER_USE_EMBEDDED_IMAGE_OCR:-0}
    DOC_READER_ENABLE_HANDWRITING_OCR: ${DOC_READER_ENABLE_HANDWRITING_OCR:-0}
    DOC_READER_ENABLE_LOCAL_HF_VISION_MODELS: ${DOC_READER_ENABLE_LOCAL_HF_VISION_MODELS:-0}
    DOC_READER_ENABLE_MEDICAL_HANDWRITING_OCR: ${DOC_READER_ENABLE_MEDICAL_HANDWRITING_OCR:-0}
