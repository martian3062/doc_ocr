    DOC_READER_MEDOCR_REFERENCE_MAX_EXAMPLES: ${DOC_READER_MEDOCR_REFERENCE_MAX_EXAMPLES:-6}
    DOC_READER_TROCR_MODEL_ID: ${DOC_READER_TROCR_MODEL_ID:-microsoft/trocr-large-handwritten}
    DOC_READER_MEDICAL_HANDWRITING_MODEL_ID: ${DOC_READER_MEDICAL_HANDWRITING_MODEL_ID:-espnet/iam_handwriting_ocr}
    DOC_READER_MEDICAL_HANDWRITING_CANDIDATE_MODEL_IDS: ${DOC_READER_MEDICAL_HANDWRITING_CANDIDATE_MODEL_IDS:-espnet/iam_handwriting_ocr,Riksarkivet/satrn_htr,Emeritus-21/Finetuned-full-HTR-model}
    DOC_READER_MEDICAL_HANDWRITING_TRUST_REMOTE_CODE: ${DOC_READER_MEDICAL_HANDWRITING_TRUST_REMOTE_CODE:-0}
    DOC_READER_MEDOCR_VISION_DATASET_ID: ${DOC_READER_MEDOCR_VISION_DATASET_ID:-naazimsnh02/medocr-vision-dataset}
    DOC_READER_GOT_OCR_MODEL_ID: ${DOC_READER_GOT_OCR_MODEL_ID:-stepfun-ai/GOT-OCR-2.0-hf}
    DOC_READER_YOLO_LAYOUT_MODEL_ID: ${DOC_READER_YOLO_LAYOUT_MODEL_ID:-Armaggheddon/yolo11-document-layout}
    DOC_READER_YOLO_LAYOUT_MODEL_FILE: ${DOC_READER_YOLO_LAYOUT_MODEL_FILE:-yolo11n_doc_layout.pt}
    DOC_READER_ENABLE_MEDICAL_VALIDATION: ${DOC_READER_ENABLE_MEDICAL_VALIDATION:-1}
    DOC_READER_REQUIRE_MEDICAL_VALIDATION: ${DOC_READER_REQUIRE_MEDICAL_VALIDATION:-1}
    DOC_READER_VALIDATION_BACKEND: ${DOC_READER_VALIDATION_BACKEND:-heuristic}
    DOC_READER_VALIDATION_MODEL_ID: ${DOC_READER_VALIDATION_MODEL_ID:-google/medgemma-1.5-4b-it}
    DOC_READER_VALIDATION_FALLBACK_MODEL_ID: ${DOC_READER_VALIDATION_FALLBACK_MODEL_ID:-Qwen/Qwen2.5-1.5B-Instruct}
    DOC_READER_ENABLE_AUTO_SCHEMA: ${DOC_READER_ENABLE_AUTO_SCHEMA:-1}
    DOC_READER_SCHEMA_PROVIDER: ${DOC_READER_SCHEMA_PROVIDER:-groq}
    DOC_READER_SCHEMA_MODEL: ${DOC_READER_SCHEMA_MODEL:-llama-3.3-70b-versatile}
    DOC_READER_SCHEMA_LOCAL_MODEL_ID: ${DOC_READER_SCHEMA_LOCAL_MODEL_ID:-Qwen/Qwen2.5-7B-Instruct}
    DOC_READER_SCHEMA_LOCAL_USE_4BIT: ${DOC_READER_SCHEMA_LOCAL_USE_4BIT:-0}
    DOC_READER_SCHEMA_MAX_NEW_TOKENS: ${DOC_READER_SCHEMA_MAX_NEW_TOKENS:-900}
    DOC_READER_SCHEMA_MAX_SOURCE_CHARS: ${DOC_READER_SCHEMA_MAX_SOURCE_CHARS:-5500}
    DOC_READER_GROQ_API_KEY: ${DOC_READER_GROQ_API_KEY:-}
    DOC_READER_ENABLE_TRANSFORMER_VALIDATION: ${DOC_READER_ENABLE_TRANSFORMER_VALIDATION:-0}
    DOC_READER_STORE_FULL_SOURCE_TEXT: ${DOC_READER_STORE_FULL_SOURCE_TEXT:-1}

services:
  postgres:
    image: postgres:16
    container_name: doc_reader_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: doc_reader
      POSTGRES_USER: doc_reader
      POSTGRES_PASSWORD: doc_reader
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: doc_reader_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    <<: *common
    build: .
    image: doc-reader-backend
    container_name: doc_reader_backend
    ports:
      - "9000:9000"
    depends_on:
      - postgres
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker:
    <<: *common
    build: .
    image: doc-reader-worker
    container_name: doc_reader_worker
    command: python manage.py rqworker --worker-class rq.SimpleWorker default
    depends_on:
      - backend
      - redis
      - postgres
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
        - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:9000}
    image: doc-reader-frontend
    container_name: doc_reader_frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:9000}
    depends_on:
      - backend

volumes:
  doc_reader_media:
  hf_cache:
  postgres_data:
