x-common: &common
  restart: unless-stopped
  volumes:
    - evolet_media:/app/media
    - evolet_db:/app/data
    - hf_cache:/root/.cache/huggingface
  environment:
    DJANGO_SETTINGS_MODULE: evolet.settings
    EVOLET_DB_PATH: /app/data/db.sqlite3
    EVOLET_DOC_WORKERS: "4"
    EVOLET_USE_4BIT: "1"

services:
  # ── Backend: Django REST API ───────────────────────────────────────────────
  backend:
    <<: *common
    build: .
    container_name: evolet_backend
    ports:
      - "9000:9000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["gpu"]

  # ── Frontend: Next.js + GSAP + Three.js ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
        - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:9000}
    container_name: evolet_frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:9000}

volumes:
  evolet_media:
  evolet_db:
  hf_cache:
