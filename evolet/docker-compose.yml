version: "3.9"
# ─────────────────────────────────────────────────────────────────────────────
# Evolet OCR Pipeline — Docker Compose
#
#   GPU (L4/T4/A100):  docker compose --profile gpu up -d
#   CPU only:          docker compose --profile cpu up -d
#   Rebuild:           docker compose --profile gpu up -d --build
#   Logs:              docker compose logs -f
#   Stop:              docker compose --profile gpu down
# ─────────────────────────────────────────────────────────────────────────────

x-common: &common
  image: evolet-pipeline:latest
  restart: unless-stopped
  ports:
    - "9000:9000"
  volumes:
    - evolet_media:/app/media
    - evolet_db:/app/data
    - hf_cache:/root/.cache/huggingface   # persist model weights across restarts
  environment:
    DJANGO_SETTINGS_MODULE: evolet.settings
    EVOLET_DOC_WORKERS: "4"
    EVOLET_USE_4BIT: "1"
    # Optional: set your HuggingFace token if models need auth
    # HF_TOKEN: "hf_xxx"

services:
  # ── GPU container (requires nvidia-container-toolkit) ──────────────────────
  web-gpu:
    <<: *common
    build: .
    container_name: evolet_gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["gpu"]

  # ── CPU-only container (no GPU required) ───────────────────────────────────
  web-cpu:
    <<: *common
    build: .
    container_name: evolet_cpu
    profiles: ["cpu"]

volumes:
  evolet_media:
  evolet_db:
  hf_cache:
