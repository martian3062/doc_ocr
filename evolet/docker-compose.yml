name: doc_reader_django_only

x-common-env: &common-env
  DJANGO_SETTINGS_MODULE: doc_reader.settings
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  DATABASE_URL: ${DATABASE_URL:-postgresql://doc_reader:doc_reader@postgres:5432/doc_reader}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_DB: ${REDIS_DB:-0}
  DOC_READER_QUEUE_MODE: rq
  DOC_READER_DOC_WORKERS: ${DOC_READER_DOC_WORKERS:-1}
  DOC_READER_MAX_WORKERS: "4"
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: compute,utility
  DOC_READER_LLM_PROVIDER: ${DOC_READER_LLM_PROVIDER:-groq}
  DOC_READER_GROQ_API_KEY: ${DOC_READER_GROQ_API_KEY:-}
  DOC_READER_GROQ_EXTRACTION_MODEL: ${DOC_READER_GROQ_EXTRACTION_MODEL:-llama-3.3-70b-versatile}
  DOC_READER_GROQ_EXTRACTION_TIMEOUT_SECONDS: ${DOC_READER_GROQ_EXTRACTION_TIMEOUT_SECONDS:-60}
  DOC_READER_SCHEMA_PROVIDER: ${DOC_READER_SCHEMA_PROVIDER:-groq}
  DOC_READER_SCHEMA_MODEL: ${DOC_READER_SCHEMA_MODEL:-llama-3.3-70b-versatile}
  DOC_READER_ENABLE_AUTO_SCHEMA: ${DOC_READER_ENABLE_AUTO_SCHEMA:-1}
  DOC_READER_ENABLE_LOCAL_HF_LLM: ${DOC_READER_ENABLE_LOCAL_HF_LLM:-0}
  DOC_READER_ENABLE_LOCAL_HF_VISION_MODELS: "1"
  DOC_READER_ENABLE_HANDWRITING_OCR: "1"
  DOC_READER_ENABLE_MEDICAL_HANDWRITING_OCR: "1"
  DOC_READER_ENABLE_GOT_VERIFICATION: "0"
  DOC_READER_ENABLE_ADVANCED_PARSERS: "1"
  DOC_READER_PARSER_BACKENDS: ${DOC_READER_PARSER_BACKENDS:-olmocr,sahi_prescription}
  DOC_READER_ENABLE_SAHI_PRESCRIPTION_SEGMENTATION: "1"
  DOC_READER_SAHI_PRESCRIPTION_DEVICE: cuda:0
  DOC_READER_SAHI_PRESCRIPTION_MAX_PAGES_PER_DOCUMENT: ${DOC_READER_SAHI_PRESCRIPTION_MAX_PAGES_PER_DOCUMENT:-3}
  DOC_READER_YOLO_LAYOUT_DPI: ${DOC_READER_YOLO_LAYOUT_DPI:-144}
  DOC_READER_ENABLE_PAGE_VISION_SWEEP: ${DOC_READER_ENABLE_PAGE_VISION_SWEEP:-1}
  DOC_READER_ENABLE_GROQ_VISION_OCR: ${DOC_READER_ENABLE_GROQ_VISION_OCR:-1}
  DOC_READER_GROQ_VISION_MODEL: ${DOC_READER_GROQ_VISION_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
  DOC_READER_PAGE_VISION_MAX_PAGES_PER_DOCUMENT: ${DOC_READER_PAGE_VISION_MAX_PAGES_PER_DOCUMENT:-2}
  DOC_READER_PAGE_VISION_MAX_CROPS_PER_PAGE: ${DOC_READER_PAGE_VISION_MAX_CROPS_PER_PAGE:-4}
  DOC_READER_ENABLE_HANDWRITING_ORDER_EXTRACTOR: ${DOC_READER_ENABLE_HANDWRITING_ORDER_EXTRACTOR:-1}
  DOC_READER_HANDWRITING_ORDER_MAX_PAGES_PER_DOCUMENT: ${DOC_READER_HANDWRITING_ORDER_MAX_PAGES_PER_DOCUMENT:-2}
  DOC_READER_HANDWRITING_ORDER_MAX_CROPS_PER_PAGE: ${DOC_READER_HANDWRITING_ORDER_MAX_CROPS_PER_PAGE:-4}
  DOC_READER_ENABLE_MULTIMODAL_MEDICINE_EXTRACTOR: ${DOC_READER_ENABLE_MULTIMODAL_MEDICINE_EXTRACTOR:-1}
  DOC_READER_MULTIMODAL_MEDICINE_BACKENDS: ${DOC_READER_MULTIMODAL_MEDICINE_BACKENDS:-dictionary}
  DOC_READER_VALIDATION_BACKEND: ${DOC_READER_VALIDATION_BACKEND:-heuristic}
  DOC_READER_ENABLE_TRANSFORMER_VALIDATION: "0"
  DOC_READER_ENABLE_MEDICAL_VALIDATION: ${DOC_READER_ENABLE_MEDICAL_VALIDATION:-1}
  DOC_READER_REQUIRE_MEDICAL_VALIDATION: ${DOC_READER_REQUIRE_MEDICAL_VALIDATION:-1}
  DOC_READER_STORE_FULL_SOURCE_TEXT: ${DOC_READER_STORE_FULL_SOURCE_TEXT:-1}
  DOC_READER_DATA_DIR: ${DOC_READER_DATA_DIR:-/data}
  DOC_READER_SKIP_EXISTING: ${DOC_READER_SKIP_EXISTING:-0}
  DOC_READER_LLM_EXTRACT_ALL_NOTES: ${DOC_READER_LLM_EXTRACT_ALL_NOTES:-1}
  DOC_READER_LLM_EXTRACT_PER_BACKEND_ARTIFACTS: ${DOC_READER_LLM_EXTRACT_PER_BACKEND_ARTIFACTS:-1}
  DOC_READER_LLM_BACKEND_NOTE_MAX_CHARS: ${DOC_READER_LLM_BACKEND_NOTE_MAX_CHARS:-6000}
  DOC_READER_MIN_SIGNAL_FOR_LLM: ${DOC_READER_MIN_SIGNAL_FOR_LLM:-3}
  DOC_READER_MIN_REGEX_MENTIONS_TO_SKIP_LLM: ${DOC_READER_MIN_REGEX_MENTIONS_TO_SKIP_LLM:-50}
  DOC_READER_SEND_SHORT_NOTES_TO_LLM: ${DOC_READER_SEND_SHORT_NOTES_TO_LLM:-1}
  # olmOCR-2 (allenai/olmOCR-2-7B-1025) — full-page VLM: printed + handwriting
  DOC_READER_ENABLE_OLMOCR_PARSER: "1"
  DOC_READER_OLMOCR_USE_4BIT: "1"
  DOC_READER_OLMOCR_MAX_PAGES_PER_DOCUMENT: ${DOC_READER_OLMOCR_MAX_PAGES_PER_DOCUMENT:-6}
  # Chandra OCR (datalab-to/chandra-ocr-2) — crop-level handwriting+printed
  DOC_READER_ENABLE_CHANDRA_OCR: "1"
  DOC_READER_CHANDRA_USE_4BIT: "1"
  # Mistral OCR 3 API — replaces Groq Vision for handwriting order extraction
  DOC_READER_ENABLE_MISTRAL_OCR: "1"
  DOC_READER_MISTRAL_API_KEY: ${DOC_READER_MISTRAL_API_KEY:-}

x-common: &common
  restart: unless-stopped
  volumes:
    - django_only_media:/app/media
    - django_only_hf_cache:/root/.cache/huggingface
    - ${DOC_READER_HOST_DATA_DIR:-/home/pardeep/data}:/data:ro
  environment: *common-env
  gpus: all

services:
  postgres:
    image: postgres:16
    container_name: doc_reader_django_only_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: doc_reader
      POSTGRES_USER: doc_reader
      POSTGRES_PASSWORD: doc_reader
    volumes:
      - django_only_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: doc_reader_django_only_redis
    restart: unless-stopped

  web:
    <<: *common
    build:
      context: .
      args:
        DOC_READER_INSTALL_FULL_MODELS: ${DOC_READER_INSTALL_FULL_MODELS:-1}
    image: doc-ocr-django-only
    container_name: doc_reader_django_only_web
    ports:
      - "${DOC_READER_DJANGO_PORT:-7000}:9000"
    depends_on:
      - postgres
      - redis

  worker:
    <<: *common
    build:
      context: .
      args:
        DOC_READER_INSTALL_FULL_MODELS: ${DOC_READER_INSTALL_FULL_MODELS:-1}
    image: doc-ocr-django-only-worker
    container_name: doc_reader_django_only_worker
    command: python manage.py rqworker --worker-class rq.SimpleWorker default
    environment:
      <<: *common-env
      RUN_MIGRATIONS: "0"
      COLLECT_STATIC: "0"
    depends_on:
      - web
      - redis
      - postgres

volumes:
  django_only_media:
  django_only_postgres_data:
  django_only_hf_cache:
