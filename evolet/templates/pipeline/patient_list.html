{% extends "base.html" %}
{% block title %}Patients{% endblock %}

{% block content %}
<div class="space-y-6 slide-up">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-white brand-font">Patients</h1>
            <p class="text-gray-400 mt-1">{{ total }} patient records</p>
        </div>
    </div>

    <!-- Search Tool -->
    <div class="glass flex items-center gap-3 p-3 rounded-2xl w-full max-w-md border border-purple-400/20 focus-within:border-purple-400/50 transition-colors">
        <svg class="w-5 h-5 text-gray-400 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input class="bg-transparent w-full text-white placeholder-gray-500 font-medium py-1 focus:outline-none"
               type="text"
               name="q"
               value="{{ query }}"
               placeholder="Search patients..."
               hx-get="{{ url('pipeline:patient_list') }}?partial=true"
               hx-trigger="keyup changed delay:500ms, search"
               hx-target="#patient-rows"
               hx-indicator=".htmx-indicator">
        <div class="htmx-indicator">
            <svg class="animate-spin h-5 w-5 text-purple-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>
    </div>

    <!-- Data Table -->
    <div class="glass rounded-2xl border border-white/5 overflow-hidden shadow-xl shadow-purple-900/10">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-white/10 text-sm text-gray-400 bg-white/5">
                        <th class="py-4 px-6 font-medium">Patient</th>
                        <th class="py-4 px-6 font-medium">Documents</th>
                        <th class="py-4 px-6 font-medium">Mentions</th>
                        <th class="py-4 px-6 font-medium text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="patient-rows" class="text-sm text-gray-300 divide-y divide-white/5">
                    {% include "pipeline/partials/patient_rows.html" %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
