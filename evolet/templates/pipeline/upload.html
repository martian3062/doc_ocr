{% extends "base.html" %}
{% block title %}Upload Files{% endblock %}

{% block content %}
<div class="space-y-8 slide-up" x-data="uploadHandler()">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-white">Upload Files</h1>
            <p class="text-gray-400 mt-1">Upload PDF or text files for extraction</p>
        </div>
    </div>

    <!-- Drag & Drop Zone -->
    <form method="post" enctype="multipart/form-data" action="{{ url('pipeline:upload') }}"
          hx-post="{{ url('pipeline:upload') }}" hx-target="#upload-result" hx-swap="innerHTML"
          class="glass rounded-2xl p-8 border-2 border-dashed border-gray-700 hover:border-cyan-500/50 transition-all"
          @dragover.prevent="dragging = true"
          @dragleave.prevent="dragging = false"
          @drop.prevent="handleDrop($event)"
          :class="{ 'border-cyan-500 bg-cyan-500/5': dragging }">
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

        <div class="text-center py-8">
            <div class="w-20 h-20 mx-auto mb-6 rounded-2xl bg-gradient-to-br from-violet-600/20 to-purple-700/20 flex items-center justify-center">
                <svg class="w-10 h-10 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                </svg>
            </div>

            <h3 class="text-xl font-semibold text-white mb-2">Drop files here</h3>
            <p class="text-gray-400 mb-6">or click to browse — supports PDF and TXT files</p>

            <label for="file-upload-input"
                   class="inline-flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-cyan-600 to-violet-600 rounded-xl text-white font-medium cursor-pointer hover:from-cyan-500 hover:to-violet-500 transition-all shadow-lg shadow-cyan-500/20">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                </svg>
                Choose Files
            </label>
            <input type="file" name="files" id="file-upload-input" class="hidden" multiple
                   accept=".pdf,.txt,.text" @change="handleFiles($event)">
        </div>

        <!-- Selected files preview -->
        <template x-if="files.length > 0">
            <div class="mt-6 space-y-2 border-t border-gray-800 pt-6">
                <h4 class="text-sm font-medium text-gray-400 mb-3" x-text="files.length + ' file(s) selected'"></h4>
                <template x-for="(file, index) in files" :key="index">
                    <div class="flex items-center gap-3 p-3 rounded-lg bg-gray-800/50">
                        <svg class="w-5 h-5 text-cyan-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                        </svg>
                        <span class="text-sm text-gray-300 flex-grow" x-text="file.name"></span>
                        <span class="text-xs text-gray-500" x-text="(file.size / 1024 / 1024).toFixed(2) + ' MB'"></span>
                        <button type="button" @click="removeFile(index)" class="text-gray-500 hover:text-red-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                </template>
                <button type="submit"
                        class="w-full mt-4 py-3 bg-gradient-to-r from-emerald-600 to-teal-600 rounded-xl text-white font-semibold hover:from-emerald-500 hover:to-teal-500 transition-all shadow-lg shadow-emerald-500/20">
                    Upload & Import
                </button>
            </div>
        </template>
    </form>

    <!-- Upload Result -->
    <div id="upload-result"></div>
</div>

{% endblock %}

{% block extra_scripts %}
<script>
function uploadHandler() {
    return {
        dragging: false,
        files: [],
        handleDrop(e) {
            this.dragging = false;
            const dt = e.dataTransfer;
            if (dt.files) {
                this.files = Array.from(dt.files);
                const input = document.getElementById('file-upload-input');
                input.files = dt.files;
            }
        },
        handleFiles(e) {
            this.files = Array.from(e.target.files);
        },
        removeFile(index) {
            this.files.splice(index, 1);
        }
    };
}
</script>
{% endblock %}
