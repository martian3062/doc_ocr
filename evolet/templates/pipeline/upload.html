{% extends "base.html" %}
{% block title %}Upload Files{% endblock %}

{% block content %}
<div class="mx-auto max-w-3xl space-y-6 slide-up" x-data="uploadHandler()">
    <header class="mesh-bg rounded-[1.6rem] border border-sky-200/70 p-6 shadow-skyglass">
        <div class="relative z-10">
            <p class="text-xs font-black uppercase tracking-[0.22em] text-sky-500">manual intake</p>
            <h1 class="mt-2 font-outfit text-4xl font-black tracking-tight text-sky-950">Upload Files</h1>
            <p class="mt-2 text-sm font-semibold text-slate-600">PDF reports, exported JSON records, or raw TXT files.</p>
        </div>
    </header>

    {% if error %}
    <div class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-bold text-red-700">{{ error }}</div>
    {% endif %}

    <form method="post" enctype="multipart/form-data"
          hx-post="{{ url('pipeline:upload') }}"
          hx-target="#upload-result"
          hx-swap="innerHTML"
          hx-encoding="multipart/form-data"
          hx-indicator="#upload-indicator"
          class="glass-strong rounded-2xl border-2 border-dashed transition-all duration-200"
          :class="dragging ? 'border-cyan-400 bg-sky-50/80' : 'border-sky-200 hover:border-sky-400'"
          @dragover.prevent="dragging = true"
          @dragleave.prevent="dragging = false"
          @drop.prevent="handleDrop($event)">
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

        <div class="p-10 text-center" x-show="files.length === 0">
            <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-br from-white via-sky-200 to-cyan-400 shadow-[0_12px_34px_rgba(56,189,248,.24)]">
                <svg class="h-8 w-8 text-sky-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                </svg>
            </div>
            <h3 class="font-outfit mb-1 text-lg font-black text-slate-800" x-text="dragging ? 'Release to add files' : 'Drag & drop files here'"></h3>
            <p class="mb-5 text-sm font-bold text-slate-500">PDF · JSON (_final.json) · TXT</p>
            <label for="file-upload-input" class="btn-primary cursor-pointer px-5 py-2.5 text-sm">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m6-6H6"/></svg>
                Choose Files
            </label>
        </div>

        <div x-show="files.length > 0" class="space-y-3 p-6">
            <div class="mb-1 flex items-center justify-between">
                <h4 class="text-sm font-black text-slate-700" x-text="`${files.length} file${files.length > 1 ? 's' : ''} · ${totalSize}`"></h4>
                <label for="file-upload-input" class="cursor-pointer text-xs font-black text-sky-600 hover:underline">Add more</label>
            </div>

            <template x-for="(file, index) in files" :key="index">
                <div class="group flex items-center gap-3 rounded-xl border border-sky-100 bg-white/80 p-3">
                    <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-xs font-black" :class="getIcon(file.name).cls" x-text="getIcon(file.name).label"></span>
                    <div class="min-w-0 flex-1">
                        <p class="truncate text-sm font-black text-slate-700" x-text="file.name"></p>
                        <p class="text-xs font-bold text-slate-400" x-text="formatSize(file.size)"></p>
                    </div>
                    <button type="button" @click="removeFile(index)" class="flex h-7 w-7 items-center justify-center rounded-lg text-slate-400 transition hover:bg-red-50 hover:text-red-600">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </template>

            <button type="submit" class="btn-primary mt-2 w-full px-4 py-3 text-sm disabled:cursor-not-allowed disabled:opacity-60" :disabled="uploading">
                <svg x-show="!uploading" class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                <svg x-show="uploading" class="h-4 w-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.58m15.36 2A8 8 0 004.58 9m0 0H9m11 11v-5h-.58m0 0a8 8 0 01-15.36-2m15.36 2H15"/></svg>
                <span x-text="uploading ? 'Uploading...' : 'Upload & Import'"></span>
            </button>
        </div>

        <input type="file" name="files" id="file-upload-input" class="hidden" multiple accept=".pdf,.txt,.text,.json" @change="handleFiles($event)">
    </form>

    <div id="upload-indicator" class="htmx-indicator">
        <div class="glass flex items-center gap-4 rounded-xl border border-sky-200/70 p-4">
            <svg class="h-5 w-5 shrink-0 animate-spin text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.58m15.36 2A8 8 0 004.58 9m0 0H9m11 11v-5h-.58m0 0a8 8 0 01-15.36-2m15.36 2H15"/></svg>
            <div class="flex-1">
                <p class="text-sm font-black text-slate-700">Processing files...</p>
                <div class="mt-1.5 h-1.5 w-full overflow-hidden rounded-full bg-sky-100">
                    <div class="shimmer h-1.5 rounded-full bg-gradient-to-r from-sky-300 to-cyan-300" style="width:100%"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="upload-result"></div>
</div>

<style>
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: block; }
    .htmx-request.htmx-indicator { display: block; }
</style>
{% endblock %}
