{% extends "base.html" %}
{% block title %}Upload Files{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6 slide-up" x-data="uploadHandler()">

    <!-- Header -->
    <div>
        <h1 class="text-3xl font-bold text-slate-800 dark:text-slate-100 brand-font">Upload Files</h1>
        <p class="text-slate-500 dark:text-slate-400 mt-1 text-sm">PDF reports, exported JSON records, or raw TXT files</p>
    </div>

    {% if error %}
    <div class="flex items-start gap-3 p-4 rounded-xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-sm text-red-700 dark:text-red-300">
        <svg class="w-4 h-4 mt-0.5 shrink-0 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        {{ error }}
    </div>
    {% endif %}

    <!-- Drop zone -->
    <form method="post" enctype="multipart/form-data"
          hx-post="{{ url('pipeline:upload') }}"
          hx-target="#upload-result"
          hx-swap="innerHTML"
          hx-encoding="multipart/form-data"
          hx-indicator="#upload-indicator"
          class="glass rounded-2xl border-2 border-dashed transition-all duration-200"
          :class="dragging
              ? 'border-purple-400/70 bg-purple-50/60 dark:bg-purple-900/20'
              : 'border-purple-200/50 dark:border-purple-500/20 hover:border-purple-300/70 dark:hover:border-purple-400/40'"
          @dragover.prevent="dragging = true"
          @dragleave.prevent="dragging = false"
          @drop.prevent="handleDrop($event)">

        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

        <!-- Empty state -->
        <div class="p-10 text-center" x-show="files.length === 0">
            <div class="w-16 h-16 mx-auto mb-5 rounded-2xl bg-gradient-to-br from-purple-500/15 to-blue-500/15 flex items-center justify-center">
                <svg class="w-8 h-8 text-purple-500 dark:text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                </svg>
            </div>
            <h3 class="text-lg font-semibold text-slate-700 dark:text-slate-200 brand-font mb-1" x-text="dragging ? 'Release to add files' : 'Drag & drop files here'"></h3>
            <p class="text-slate-400 dark:text-slate-500 text-sm mb-5">PDF · JSON (_final.json) · TXT</p>
            <label for="file-upload-input"
                   class="inline-flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 rounded-xl text-white text-sm font-semibold cursor-pointer transition-all shadow-lg shadow-purple-500/20 hover:shadow-purple-500/35">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                Choose Files
            </label>
        </div>

        <!-- File list -->
        <div x-show="files.length > 0" class="p-6 space-y-3">
            <div class="flex items-center justify-between mb-1">
                <h4 class="text-sm font-semibold text-slate-600 dark:text-slate-300" x-text="`${files.length} file${files.length > 1 ? 's' : ''} · ${totalSize}`"></h4>
                <label for="file-upload-input" class="text-xs text-purple-600 dark:text-purple-400 hover:underline cursor-pointer">Add more</label>
            </div>

            <template x-for="(file, index) in files" :key="index">
                <div class="flex items-center gap-3 p-3 rounded-xl bg-slate-50 dark:bg-white/5 border border-slate-200/60 dark:border-white/8 group">
                    <span class="w-9 h-9 rounded-lg flex items-center justify-center text-xs font-bold shrink-0"
                          :class="getIcon(file.name).cls"
                          x-text="getIcon(file.name).label"></span>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm text-slate-700 dark:text-slate-200 font-medium truncate" x-text="file.name"></p>
                        <p class="text-xs text-slate-400" x-text="formatSize(file.size)"></p>
                    </div>
                    <button type="button" @click="removeFile(index)"
                            class="w-6 h-6 flex items-center justify-center rounded text-slate-300 dark:text-slate-600 hover:text-red-500 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors opacity-0 group-hover:opacity-100">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </template>

            <!-- Upload button -->
            <button type="submit"
                    class="w-full mt-2 py-3 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 rounded-xl text-white text-sm font-semibold transition-all shadow-lg shadow-purple-500/20 hover:shadow-purple-500/35 flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed"
                    :disabled="uploading">
                <svg x-show="!uploading" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                <svg x-show="uploading" class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                <span x-text="uploading ? 'Uploading…' : 'Upload & Import'"></span>
            </button>
        </div>

        <input type="file" name="files" id="file-upload-input" class="hidden" multiple
               accept=".pdf,.txt,.text,.json"
               @change="handleFiles($event)">
    </form>

    <!-- Upload progress indicator (HTMX-driven) -->
    <div id="upload-indicator" class="htmx-indicator">
        <div class="glass rounded-xl p-4 flex items-center gap-4 border border-purple-200/40 dark:border-purple-500/15">
            <svg class="w-5 h-5 text-purple-500 animate-spin shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            <div class="flex-1">
                <p class="text-sm font-medium text-slate-700 dark:text-slate-200">Processing files…</p>
                <div class="mt-1.5 w-full bg-slate-200 dark:bg-white/10 rounded-full h-1.5 overflow-hidden">
                    <div class="h-1.5 rounded-full bg-gradient-to-r from-purple-500 to-blue-500 shimmer" style="width:100%"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Result area -->
    <div id="upload-result"></div>

</div>

<style>
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: block; }
    .htmx-request.htmx-indicator { display: block; }
</style>
{% endblock %}
