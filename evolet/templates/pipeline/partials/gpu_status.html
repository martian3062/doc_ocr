{# HTMX partial: GPU status badge in nav #}
{% if gpu.available %}
<div class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-purple-500/10 dark:bg-purple-500/15 border border-purple-500/20" title="{{ gpu.device_name }} · {{ gpu.free_gb }}GB free">
    <span class="w-1.5 h-1.5 rounded-full bg-purple-400 animate-pulse"></span>
    <span class="text-xs text-purple-600 dark:text-purple-300 font-medium">GPU</span>
</div>
{% else %}
<div class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/8">
    <span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
    <span class="text-xs text-slate-500 dark:text-slate-400">CPU</span>
</div>
{% endif %}
