<!-- HTMX partial: Upload result -->
<div class="glass rounded-2xl p-6 border border-emerald-500/30 bg-emerald-500/5 slide-up">
    <div class="flex items-center gap-3 mb-3">
        <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <h3 class="text-lg font-semibold text-emerald-400">Import Successful</h3>
    </div>
    <p class="text-gray-300">
        <span class="text-white font-bold">{{ count }}</span> file(s) imported successfully.
        {% if folder %}from <span class="font-mono text-xs text-gray-400">{{ folder }}</span>{% endif %}
    </p>
    <div class="mt-4 flex gap-3">
        <a href="{{ url('pipeline:patient_list') }}" class="px-4 py-2 bg-white/5 rounded-lg text-sm text-gray-300 hover:bg-white/10 transition-colors">View Patients →</a>
        <form method="post" action="{{ url('pipeline:start_run') }}" class="inline">
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
            <button type="submit" class="px-4 py-2 bg-gradient-to-r from-emerald-600 to-teal-600 rounded-lg text-sm text-white font-medium">Run Pipeline →</button>
        </form>
    </div>
</div>
