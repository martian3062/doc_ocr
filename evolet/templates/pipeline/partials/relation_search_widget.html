{#
  Partial: relation_search_widget.html
  Context vars: patient_code (optional string — scopes search to a patient)
  Alpine component: relationSearchWidget (defined in app.js)
#}

<div class="glass rounded-2xl border border-slate-200/30 dark:border-white/5 overflow-hidden"
     x-data="relationSearchWidget()"
     x-init="patientCode = '{{ patient_code|default('') }}'">

    <!-- Search bar -->
    <div class="flex items-center gap-3 px-5 py-4 border-b border-slate-200/40 dark:border-white/5">
        <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input type="text"
               x-model="q"
               @keydown.enter="search()"
               @keydown.escape="results = []; searched = false"
               placeholder="Search diagnoses, drugs, symptoms…"
               class="flex-1 bg-transparent text-sm text-slate-700 dark:text-slate-200 placeholder-slate-400 focus:outline-none">
        <div class="flex items-center gap-2 shrink-0">
            <select x-model.number="k"
                    class="text-xs font-mono text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-white/8 border border-slate-200 dark:border-white/10 rounded-lg px-2 py-1 focus:outline-none">
                <option value="5">Top 5</option>
                <option value="10" selected>Top 10</option>
                <option value="20">Top 20</option>
            </select>
            <button @click="search()"
                    :disabled="loading || !q.trim()"
                    class="flex items-center gap-1.5 px-3 py-1.5 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 disabled:opacity-50 disabled:cursor-not-allowed rounded-lg text-white text-xs font-semibold transition-all">
                <svg x-show="!loading" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <svg x-show="loading" class="w-3.5 h-3.5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Search
            </button>
        </div>
    </div>

    <!-- Error -->
    <div x-show="err" class="px-5 py-3 text-xs text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/10 border-b border-red-100 dark:border-red-800/30" x-text="err"></div>

    <!-- Results -->
    <div x-show="searched && !loading">
        <template x-if="results.length > 0">
            <div class="divide-y divide-slate-100 dark:divide-white/5 max-h-72 overflow-y-auto">
                <template x-for="(r, i) in results" :key="i">
                    <div class="flex items-start gap-4 px-5 py-3 hover:bg-slate-50 dark:hover:bg-white/3 transition-colors">
                        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-purple-500/20 to-blue-500/20 flex items-center justify-center shrink-0">
                            <span class="text-[10px] font-bold text-purple-600 dark:text-purple-400" x-text="(i+1)"></span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between gap-2 mb-0.5">
                                <span class="text-sm font-semibold text-slate-700 dark:text-slate-200 truncate" x-text="r.value || r.label"></span>
                                <span class="text-[10px] font-mono text-purple-600 dark:text-purple-400 bg-purple-50 dark:bg-purple-500/10 px-1.5 py-0.5 rounded border border-purple-200/50 dark:border-purple-500/20 shrink-0" x-text="r.category"></span>
                            </div>
                            <p class="text-xs text-slate-500 dark:text-slate-400 truncate" x-show="r.patient_code" x-text="`Patient: ${r.patient_code}`"></p>
                            <p class="text-xs text-slate-400 dark:text-slate-500 italic font-mono truncate" x-show="r.evidence_quote" x-text="`"${r.evidence_quote}"`"></p>
                        </div>
                        <div class="shrink-0 text-right">
                            <span class="text-[10px] font-bold text-slate-400 dark:text-slate-500" x-show="r.score !== undefined" x-text="`${(r.score * 100).toFixed(0)}%`"></span>
                        </div>
                    </div>
                </template>
            </div>
        </template>
        <template x-if="results.length === 0 && searched && !loading && !err">
            <div class="px-5 py-8 text-center text-sm text-slate-400 dark:text-slate-500 italic">
                No results found for "<span x-text="q" class="font-mono not-italic"></span>"
            </div>
        </template>
    </div>

    <!-- Idle state -->
    <div x-show="!searched && !loading" class="px-5 py-4 text-xs text-slate-400 dark:text-slate-500">
        Search clinical relations using FAISS semantic similarity
        {% if patient_code %} · scoped to <span class="font-mono text-purple-600 dark:text-purple-400">{{ patient_code }}</span>{% endif %}
    </div>

</div>
