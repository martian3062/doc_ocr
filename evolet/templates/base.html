<!DOCTYPE html>
<html lang="en" x-data="appShell()" x-init="initApp()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}doc-ocr{% endblock %} - doc-ocr</title>
    <meta name="description" content="Django-only doc-ocr clinical document review UI.">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui'],
                        display: ['Outfit', 'Inter', 'ui-sans-serif'],
                    },
                    boxShadow: {
                        skyglass: '0 24px 80px rgba(61,169,230,0.18)',
                        panel: '0 18px 54px rgba(45,178,240,0.20)',
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="{{ static('js/app.js') }}"></script>

    <style>
        :root {
            --page-bg: #f7fcff;
            --ink: #123047;
            --muted: #557184;
            --sky: #38bdf8;
            --cyan: #67e8f9;
            --border: rgba(93,188,239,0.32);
            --surface: rgba(255,255,255,0.74);
            --surface-strong: rgba(255,255,255,0.92);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            background:
                radial-gradient(circle at 12% 10%, rgba(157,231,255,0.72), transparent 28%),
                radial-gradient(circle at 82% 0%, rgba(209,247,255,0.85), transparent 26%),
                linear-gradient(135deg, #ffffff 0%, #f5fbff 34%, #dff6ff 68%, #ffffff 100%);
            -webkit-font-smoothing: antialiased;
        }
        .font-outfit, h1, h2, h3 { font-family: Outfit, Inter, ui-sans-serif, system-ui, sans-serif; }
        .mesh-bg {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 8% 12%, rgba(107,216,255,0.44), transparent 26%),
                radial-gradient(circle at 62% 0%, rgba(255,255,255,0.92), transparent 30%),
                radial-gradient(circle at 95% 28%, rgba(127,236,255,0.34), transparent 24%),
                linear-gradient(135deg, rgba(255,255,255,0.82), rgba(218,246,255,0.72));
        }
        .mesh-bg::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(115deg, transparent 0 28%, rgba(255,255,255,0.58) 35%, transparent 43%),
                radial-gradient(circle, rgba(255,255,255,0.95) 0 1px, transparent 1.6px);
            background-size: 260% 260%, 42px 42px;
            opacity: 0.72;
            animation: sparkle-drift 8s linear infinite;
        }
        @keyframes sparkle-drift {
            from { background-position: 180% 0, 0 0; }
            to { background-position: -80% 0, 42px 42px; }
        }
        .glass {
            background: var(--surface);
            backdrop-filter: blur(22px) saturate(185%);
            -webkit-backdrop-filter: blur(22px) saturate(185%);
            border: 1px solid var(--border);
            box-shadow: 0 24px 80px rgba(61,169,230,0.18);
        }
        .glass-strong {
            background: var(--surface-strong);
            backdrop-filter: blur(26px) saturate(185%);
            -webkit-backdrop-filter: blur(26px) saturate(185%);
            border: 1px solid rgba(93,188,239,0.44);
            box-shadow: 0 18px 54px rgba(45,178,240,0.20);
        }
        .panel-dark {
            background: rgba(17,17,29,0.92);
            border: 1px solid rgba(30,41,59,0.95);
            color: #f8fafc;
        }
        .panel-dark .muted { color: #94a3b8; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            border-radius: 0.9rem;
            padding: 0.85rem 1rem;
            color: #475569;
            font-weight: 700;
            transition: all .18s ease;
            position: relative;
        }
        .nav-item:hover, .nav-item.active {
            color: #0369a1;
            background: rgba(224,242,254,0.82);
            box-shadow: 0 12px 34px rgba(56,189,248,0.18);
        }
        .nav-item.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0.65rem;
            bottom: 0.65rem;
            width: 4px;
            border-radius: 0 999px 999px 0;
            background: #38bdf8;
        }
        .stat-card {
            border-radius: 1rem;
            border: 1px solid #1e293b;
            background: #020617;
            color: white;
            padding: 1.25rem;
        }
        .schema-card {
            border-radius: .75rem;
            border: 1px solid rgba(30,41,59,.9);
            background: rgba(2,6,23,.38);
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            border-radius: .8rem;
            background: linear-gradient(90deg, #ffffff, #bae6fd 45%, #22d3ee);
            color: #082f49;
            font-weight: 900;
            box-shadow: 0 12px 34px rgba(56,189,248,.25);
            transition: transform .18s ease, box-shadow .18s ease;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 18px 42px rgba(56,189,248,.34); }
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            border-radius: .8rem;
            border: 1px solid rgba(125,211,252,.7);
            background: rgba(255,255,255,.74);
            color: #0369a1;
            font-weight: 900;
        }
        .status-completed { color: #047857; background: rgba(16,185,129,.12); border-color: rgba(16,185,129,.28); }
        .status-failed { color: #b91c1c; background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.28); }
        .status-active { color: #0369a1; background: rgba(14,165,233,.14); border-color: rgba(14,165,233,.30); }
        .shimmer {
            background-size: 220% 100%;
            animation: shimmer 1.8s linear infinite;
        }
        @keyframes shimmer {
            from { background-position: 120% 0; }
            to { background-position: -120% 0; }
        }
        .slide-up { animation: slide-up .28s ease-out both; }
        @keyframes slide-up {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #9adffb; border-radius: 999px; }
        ::selection { background: #6ed7ff; color: #073047; }
        [x-cloak] { display: none !important; }
        @media (max-width: 1023px) {
            .app-shell { grid-template-columns: 1fr !important; }
            .sidebar { position: sticky; top: 0; height: auto; width: 100%; z-index: 40; }
            .sidebar nav { display: flex; overflow-x: auto; padding-bottom: .5rem; }
            .sidebar-footer { display: none; }
        }
    </style>
</head>
<body>
    <div class="app-shell grid min-h-screen grid-cols-[260px_1fr]">
        <aside class="sidebar border-r border-sky-200/70 bg-white/70 shadow-[18px_0_70px_rgba(67,181,232,0.16)] backdrop-blur-2xl lg:sticky lg:top-0 lg:h-screen">
            <div class="flex items-center gap-3 p-6">
                <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-tr from-white via-sky-200 to-cyan-400 shadow-[0_10px_28px_rgba(56,189,248,0.3)]">
                    <svg class="h-5 w-5 text-sky-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7a2 2 0 012-2h12a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V7zm4 3h8M8 14h5"/></svg>
                </div>
                <a href="{{ url('pipeline:dashboard') }}" class="font-outfit bg-gradient-to-r from-sky-950 via-sky-500 to-cyan-300 bg-clip-text text-xl font-black tracking-tight text-transparent">doc-ocr</a>
            </div>

            <nav class="space-y-2 px-4">
                <a href="{{ url('pipeline:dashboard') }}" class="nav-item" data-path="/">
                    <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 13h6V4H4v9zm10 7h6V4h-6v16zM4 20h6v-3H4v3z"/></svg>
                    <span>Overview</span>
                </a>
                <a href="{{ url('pipeline:patient_list') }}" class="nav-item" data-path="/patients/">
                    <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-4-4h-1M9 20H4v-2a4 4 0 014-4h1m0-4a4 4 0 100-8 4 4 0 000 8zm8 0a4 4 0 100-8 4 4 0 000 8z"/></svg>
                    <span>Patients</span>
                </a>
                <a href="{{ url('pipeline:run_list') }}" class="nav-item" data-path="/runs/">
                    <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    <span>Runs</span>
                </a>
                <a href="{{ url('pipeline:parallel_approaches') }}" class="nav-item" data-path="/approaches/">
                    <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 7h7m-7 5h12m-12 5h16M15 5l3 2-3 2m-3 1l3 2-3 2m5 1l3 2-3 2"/></svg>
                    <span>Parallel Approaches</span>
                </a>
                <a href="{{ url('pipeline:folder_browser') }}" class="nav-item" data-path="/folder/">
                    <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 7a2 2 0 012-2h5l2 2h7a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
                    <span>Documents</span>
                </a>
                <a href="{{ url('pipeline:upload') }}" class="nav-item" data-path="/upload/">
                    <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                    <span>Upload</span>
                </a>
                <a href="{{ url('pipeline:qc_summary') }}" class="nav-item" data-path="/qc/">
                    <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span>QC</span>
                </a>
            </nav>

            <div class="sidebar-footer absolute bottom-0 left-0 right-0 p-4">
                <div class="glass rounded-2xl p-4">
                    <div class="flex items-center gap-3">
                        <div class="flex h-10 w-10 items-center justify-center rounded-full border border-sky-200 bg-sky-100/80">
                            <svg class="h-5 w-5 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 7h10v10H7z"/></svg>
                        </div>
                        <div>
                            <p class="text-sm font-bold text-slate-700">Django-only</p>
                            <p class="text-xs font-semibold text-slate-500">CPU + Groq runtime</p>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="min-w-0">
            <main class="mx-auto max-w-[1760px] px-5 py-6 lg:px-8">
                {% if messages %}
                <div class="mb-6 space-y-2">
                    {% for message in messages %}
                    <div class="rounded-xl border border-sky-200 bg-white/80 px-4 py-3 text-sm font-semibold text-slate-700 shadow-skyglass">{{ message }}</div>
                    {% endfor %}
                </div>
                {% endif %}
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname;
            document.querySelectorAll('.nav-item').forEach((el) => {
                const target = el.getAttribute('data-path');
                if ((target === '/' && path === '/') || (target !== '/' && path.startsWith(target))) {
                    el.classList.add('active');
                }
            });
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
