<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Evolet{% endblock %} — TMH OCR Pipeline</title>
    <meta name="description" content="Evolet TMH Patient PDF extraction pipeline — powered by Qwen LLM">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfeff',
                            100: '#cffafe',
                            200: '#a5f3fc',
                            300: '#67e8f9',
                            400: '#22d3ee',
                            500: '#06b6d4',
                            600: '#0891b2',
                            700: '#0e7490',
                            800: '#155e75',
                            900: '#164e63',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
        }
        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-hover:hover {
            background: rgba(15, 23, 42, 0.85);
            border-color: rgba(6, 182, 212, 0.3);
        }
        .glow {
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.15);
        }
        .glow-text {
            text-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
        }
        .gradient-text {
            background: linear-gradient(135deg, #22d3ee, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .card-shine {
            position: relative;
            overflow: hidden;
        }
        .card-shine::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
            transition: left 0.5s;
        }
        .card-shine:hover::before {
            left: 100%;
        }
        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes slide-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .slide-up { animation: slide-up 0.4s ease-out; }
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline-block;
        }
        .htmx-request.htmx-indicator {
            display: inline-block;
        }
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body class="font-sans text-gray-200 antialiased">
    <!-- Navigation -->
    <nav class="glass sticky top-0 z-50 border-b border-gray-800/50" x-data="{ mobileOpen: false }">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <a href="{{ url('pipeline:dashboard') }}" class="flex items-center gap-3 group">
                    <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-cyan-500 to-violet-600 flex items-center justify-center group-hover:scale-110 transition-transform">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                    </div>
                    <span class="text-xl font-bold gradient-text">Evolet</span>
                </a>

                <!-- Desktop Nav -->
                <div class="hidden md:flex items-center gap-1">
                    <a href="{{ url('pipeline:dashboard') }}" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all">Dashboard</a>
                    <a href="{{ url('pipeline:patient_list') }}" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all">Patients</a>
                    <a href="{{ url('pipeline:folder_browser') }}" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all">Folders</a>
                    <a href="{{ url('pipeline:upload') }}" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all">Upload</a>
                    <a href="{{ url('pipeline:run_list') }}" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all">Runs</a>
                    <a href="{{ url('pipeline:qc_summary') }}" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all">QC</a>
                </div>

                <!-- GPU Status -->
                <div class="hidden lg:block" hx-get="{{ url('pipeline:api_gpu_status') }}" hx-trigger="load, every 30s" hx-swap="innerHTML">
                    <span class="text-xs text-gray-500">Loading GPU...</span>
                </div>

                <!-- Mobile toggle -->
                <button @click="mobileOpen = !mobileOpen" class="md:hidden p-2 rounded-lg text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path x-show="!mobileOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        <path x-show="mobileOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Mobile menu -->
            <div x-show="mobileOpen" x-transition class="md:hidden pb-4 space-y-1">
                <a href="{{ url('pipeline:dashboard') }}" class="block px-4 py-2 rounded-lg text-sm text-gray-300 hover:bg-white/5">Dashboard</a>
                <a href="{{ url('pipeline:patient_list') }}" class="block px-4 py-2 rounded-lg text-sm text-gray-300 hover:bg-white/5">Patients</a>
                <a href="{{ url('pipeline:folder_browser') }}" class="block px-4 py-2 rounded-lg text-sm text-gray-300 hover:bg-white/5">Folders</a>
                <a href="{{ url('pipeline:upload') }}" class="block px-4 py-2 rounded-lg text-sm text-gray-300 hover:bg-white/5">Upload</a>
                <a href="{{ url('pipeline:run_list') }}" class="block px-4 py-2 rounded-lg text-sm text-gray-300 hover:bg-white/5">Runs</a>
                <a href="{{ url('pipeline:qc_summary') }}" class="block px-4 py-2 rounded-lg text-sm text-gray-300 hover:bg-white/5">QC</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-800/50 mt-16">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center text-xs text-gray-600">
            Evolet TMH OCR Pipeline &mdash; 4baseCare &mdash; Powered by Qwen + PyMuPDF + Doctr
        </div>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
